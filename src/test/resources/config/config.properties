# Shared defaults. Any key can be overridden by the environment file
# (config/<env>.properties, selected with -Denv=<name>) or a -D system property.
base.uri=https://restful-booker.herokuapp.com

# Demo credentials for the public Restful-Booker API.
# For a real API, never commit credentials: inject them from CI secrets via
#   mvn test -Dauth.username=... -Dauth.password=...
auth.username=admin
auth.password=password123

timeout.connection.ms=30000
timeout.socket.ms=30000

# Upper bound asserted on every response time
assert.max.response.time.ms=30000

# Failed-scenario retries (0 = a failure is always a failure)
retry.max.count=0
